<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lallemand F. — Explorations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body style="margin:0;">
  <div id="root"></div>
  <script type="text/babel" data-presets="react" src="design-canvas.jsx"></script>
  <script type="text/babel" data-presets="react" src="explorations-components.jsx"></script>
  <script type="text/babel" data-presets="react">
    function Root() {
      return (
        <DesignCanvas>
          <DCSection id="hero" title="Hero parallax — 3 directions" subtitle="Le parallax d'origine reste, mais change de composition.">
            <DCArtboard id="a" label="A · Nom à travers les couches" width={1100} height={620}><HeroA/></DCArtboard>
            <DCArtboard id="b" label="B · Split éditorial" width={1100} height={620}><HeroB/></DCArtboard>
            <DCArtboard id="c" label="C · Couverture magazine" width={1100} height={620}><HeroC/></DCArtboard>
          </DCSection>
          <DCSection id="gallery" title="Galerie — 3 traitements" subtitle="Trois manières de lire les photos de Liège.">
            <DCArtboard id="a" label="A · Editorial varié" width={760} height={560}><GalleryA/></DCArtboard>
            <DCArtboard id="b" label="B · Cinéma / contact sheet" width={760} height={560}><GalleryB/></DCArtboard>
            <DCArtboard id="c" label="C · Constellation stéréographique" width={560} height={520}><GalleryC/></DCArtboard>
          </DCSection>
          <DCSection id="lab" title="Web lab — traitement code">
            <DCArtboard id="code" label="Éditeur · tags" width={760} height={440}><LabCard/></DCArtboard>
            <DCArtboard id="micro" label="Page complète (mobile-ish)" width={380} height={640}><FullPreview/></DCArtboard>
          </DCSection>
          <DCPostIt top={-30} left={60} rotate={-3}>
            Palette : ivory #fffae1 · sand #b8b08d · coffee #221c17. Accent clay #c19366.
          </DCPostIt>
        </DesignCanvas>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
  </script>
</body>
</html>
